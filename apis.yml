aid: airspace-link
name: Airspace Link
description: >-
  Airspace Link provides digital infrastructure for safer skies, operating the
  AirHub platform for drone and unmanned aircraft system (UAS) operations. Its
  AirHub API is a REST service that delivers airspace awareness, FAA data, LAANC
  authorizations, B4UFLY briefings, operational hazard and risk assessment,
  routing, elevation, position telemetry, and vector tiles to power UAS
  applications. Airspace Link also offers a Drone Operations Management System
  (DOMS), FAA-approved Unmanned Traffic Management (UTM) services, and airspace
  security capabilities for state and local governments, federal and defense
  agencies, and commercial drone programs. The API authenticates with OAuth 2.0
  client-credentials plus an API key and runs in separate sandbox and live
  environments.
